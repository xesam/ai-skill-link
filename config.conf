# skill-link built-in default configuration
# This file ships with the npm package and defines default settings for 24 AI CLI tools.
# To add or override settings, create ~/.config/ai-skill-link/config.conf.
# User config entries with the same name override built-in entries.
# This file is updated automatically via npm update; the user config is never touched.

# ============================================================================
# [source] - Skills Source Configuration
# ============================================================================
# Define named repositories for organizing skills from different sources.
#
# Usage:
#   - 'default' is optional: used as the source root when --source is not
#     specified. When omitted, skills are looked up across all named sources.
#   - Other names: custom named repos, referenced via --source <name>, and
#     aggregated for --all / --list / by-name lookup.
#   - Paths starting with ~ are expanded to user home directory
#
# Priority: command-line --source > user config [source] default
#
# You normally don't edit this by hand — manage sources with commands:
#   skill-link --add-source ~/my-skills ~/work/project-x/skills   # register dirs
#   skill-link --list-sources                                      # show sources
#   skill-link --remove-source project-x                           # remove by name
# --add-source auto-names each dir (leaf 'skills' -> parent name),
# skips already-registered paths, and errors on missing directories.
#
# Examples:
#   [source]
#   default = ~/my-skills
#   work    = ~/work-skills
#   oss     = ~/opensource-skills
#
# Then use:
#   skill-link --list                    # uses 'default' repo
#   skill-link --list --repo work        # uses 'work' repo
#   skill-link --list --repo /tmp/test   # uses temporary path

# [source]
# default = ~/my-skills

# ============================================================================
# [clis] - AI CLI Tools Configuration
# ============================================================================
# Define AI CLI tools and their skills directory paths.
#
# Format: <cli-name> = <path-to-skills-directory>
#   - Paths starting with ~ are expanded to user home directory
#   - Use --list-clis to see current merged configuration
#   - Use --cli all to operate on all configured CLI tools
#
# Built-in CLI tools:

[clis]
codex       = ~/.codex/skills
claude-code = ~/.claude/skills
gemini      = ~/.gemini/skills
qwen-code   = ~/.qwen/skills
trae        = ~/.trae/skills
trae-cn        = ~/.trae-cn/skills
cursor      = ~/.cursor/skills
windsurf    = ~/.windsurf/skills
cline       = ~/.cline/skills
aider       = ~/.aider/skills
continue    = ~/.continue/skills
copilot     = ~/.github-copilot/skills
amazonq     = ~/.aws/amazonq/skills
cody        = ~/.cody/skills
codeium     = ~/.codeium/skills
zed         = ~/.zed/skills
tabnine     = ~/.tabnine/skills
pieces      = ~/.pieces/skills
blackbox    = ~/.blackbox/skills
replit      = ~/.replit/skills
aicode      = ~/.aicode/skills
devin       = ~/.devin/skills
pi              = ~/.pi/agent/skills
deepseek-harness = ~/.dsh/skills
# Additional shared cross-agent convention directory supported by both pi and dsh:
# agents      = ~/.agents/skills

# ============================================================================
# [clis-project] - Project-level Skills Directory Overrides
# ============================================================================
# Most CLI tools use the same path structure for both global and project-level
# skills directories — only the prefix differs (~ vs project root). For those,
# --project automatically derives the path by replacing ~ with the project path.
#
# A few tools (e.g. pi) use a *different* structure at the project level.
# List those tools here with their project-relative paths so --project links
# to the correct location:
#
#   Global:  ~/.pi/agent/skills
#   Project: .pi/skills         ← different structure, needs override
#
# Entries are relative paths (no ~). Unlisted CLIs fall back to the automatic
# ~ → project-root derivation.

[clis-project]
pi = .pi/skills

# ============================================================================
# Custom Configuration
# ============================================================================
# To customize settings without modifying this file:
#
# 1. Create ~/.config/ai-skill-link/config.conf
# 2. Add your custom settings (entries override built-in defaults)
# 3. This file lives outside the package directory — npm update never touches it
#
# Example ~/.config/ai-skill-link/config.conf:
#
#   [source]
#   default = ~/my-skills
#   work    = ~/work-skills
#
#   [clis]
#   cursor  = ~/.cursor/skills
#   my-tool = ~/path/to/my-tool/skills
#
#   [clis-project]
#   my-tool = .my-tool/skills
