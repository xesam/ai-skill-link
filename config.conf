# skill-link built-in default configuration
# This file ships with the npm package and defines default settings for 22 AI CLI tools.
# To add or override settings, create ~/.config/ai-skill-link/config.conf.
# User config entries with the same name override built-in entries.
# This file is updated automatically via npm update; the user config is never touched.

# ============================================================================
# [source] - Skills Source Configuration
# ============================================================================
# Define named repositories for organizing skills from different sources.
#
# Usage:
#   - 'default' is special: used when --repo parameter is not specified
#   - Other names: custom named repos, referenced via --repo <name>
#   - Paths starting with ~ are expanded to user home directory
#
# Priority: command-line --source > user config [source] default
#
# Examples:
#   [source]
#   default = ~/my-skills
#   work    = ~/work-skills
#   oss     = ~/opensource-skills
#
# Then use:
#   skill-link --list                    # uses 'default' repo
#   skill-link --list --repo work        # uses 'work' repo
#   skill-link --list --repo /tmp/test   # uses temporary path

# [source]
# default = ~/my-skills

# ============================================================================
# [clis] - AI CLI Tools Configuration
# ============================================================================
# Define AI CLI tools and their skills directory paths.
#
# Format: <cli-name> = <path-to-skills-directory>
#   - Paths starting with ~ are expanded to user home directory
#   - Use --list-clis to see current merged configuration
#   - Use --cli all to operate on all configured CLI tools
#
# Built-in CLI tools:

[clis]
codex       = ~/.codex/skills
claude-code = ~/.claude/skills
gemini      = ~/.gemini/skills
qwen-code   = ~/.qwen/skills
trae        = ~/.trae/skills
trae-cn        = ~/.trae-cn/skills
cursor      = ~/.cursor/skills
windsurf    = ~/.windsurf/skills
cline       = ~/.cline/skills
aider       = ~/.aider/skills
continue    = ~/.continue/skills
copilot     = ~/.github-copilot/skills
amazonq     = ~/.aws/amazonq/skills
cody        = ~/.cody/skills
codeium     = ~/.codeium/skills
zed         = ~/.zed/skills
tabnine     = ~/.tabnine/skills
pieces      = ~/.pieces/skills
blackbox    = ~/.blackbox/skills
replit      = ~/.replit/skills
aicode      = ~/.aicode/skills
devin       = ~/.devin/skills

# ============================================================================
# Custom Configuration
# ============================================================================
# To customize settings without modifying this file:
#
# 1. Create ~/.config/ai-skill-link/config.conf
# 2. Add your custom settings (entries override built-in defaults)
# 3. This file lives outside the package directory — npm update never touches it
#
# Example ~/.config/ai-skill-link/config.conf:
#
#   [source]
#   default = ~/my-skills
#   work    = ~/work-skills
#
#   [clis]
#   cursor  = ~/.cursor/skills
#   my-tool = ~/path/to/my-tool/skills
